# ============================================================ #
#                   SELL PLUGIN CONFIG                         #
# ============================================================ #
#
# Every piece of text here is written in MiniMessage, so colours, gradients,
# hex and decorations are yours to set and the plugin adds none of its own:
#   <green>, <#00ffcc>, <bold>, <gradient:#ff0066:#ffcc00>text</gradient>
# Full tag list: https://docs.advntr.dev/minimessage/format.html
# Old & colour codes still work and can be mixed in, so an existing config
# keeps rendering until you get round to converting it.

# Internal schema version. DO NOT edit this by hand – the plugin uses it to
# auto-migrate old configs (adding any new options you're missing) and it makes
# a timestamped backup of your old file first. If this key is missing the plugin
# assumes an old config and migrates anyway.
config-version: 2

# ---- Feature toggles --------------------------------------- #
# Turn any major part of the plugin on or off. Everything defaults to on.
features:
  # Category sell multipliers (earn more the more you sell in a category).
  # When off, everything sells at a flat 1.0x.
  multipliers: true
  # Add extra value for enchantments (see the "enchantments" section below).
  enchantment-pricing: true
  # Allow selling the contents of shulker boxes.
  shulker-selling: true
  # The /sellmulti multiplier / progress-bar GUI.
  progress-gui: true
  # The /topsell leaderboard.
  top-sell: true
  # The "+$amount" action-bar pop-up shown after a sale.
  action-bar: true

# ---- Enchantment pricing ----------------------------------- #
# When enchantment-pricing is enabled, an item's price is calculated as:
#   (base price + sum of each enchantment's value × its level)
#   × (multiplier-per-enchantment ^ number of distinct enchantments)
# Example: a base $100 sword with Sharpness V and Unbreaking III, using the
# defaults below (value 50/level, factor 1.1):
#   added   = 50×5 + 50×3 = 400  →  base+added = 500
#   factor  = 1.1 ^ 2 distinct enchants = 1.21
#   price   = 500 × 1.21 = $605
enchantments:
  # Value added per enchantment level for any enchantment not listed below.
  default-value-per-level: 50.0
  # The price is multiplied by this for EACH distinct enchantment on the item.
  multiplier-per-enchantment: 1.1
  # Per-enchantment overrides. Keys are the vanilla enchantment ids (lowercase).
  # Anything not listed uses default-value-per-level above.
  values:
    sharpness: 60.0
    protection: 40.0
    mending: 300.0
    unbreaking: 30.0
    efficiency: 40.0
    fortune: 150.0
    silk_touch: 200.0

# Money required to unlock the first multiplier level (1.1x).
# Each subsequent level costs (previous cost × multiplier).
# e.g. start-multiplier: 1000, multiplier: 1.6
#   → 1.1x costs $1000, 1.2x costs $1600, 1.3x costs $2560 …
start-multiplier: 1000.0
multiplier: 1.6

# Maximum multiplier cap (used for progress bar display)
max-multiplier: 3.0

# ---- Progress bar (snake path) --------------------------------------------- #
# The /sellmulti → category progress menu draws a "snake" of milestone nodes.
# Each node is a block that changes appearance based on its state. Any valid
# Material works here (glass panes, wool, concrete, ores, …) – customise freely.
# The text on every node is fully customisable under messages.category-progress.
progress-bar:
  completed-color: "LIME_STAINED_GLASS_PANE"
  inprogress-color: "YELLOW_STAINED_GLASS_PANE"
  locked-color: "GRAY_STAINED_GLASS_PANE"

# ---- Prefix / Notifications -------------------------------- #

# Show a chat prefix message after selling?
# Set to false to disable chat messages. Action bar is always shown.
prefix-enabled: false

# Play a sound when items are sold?
sounds-enabled: true

# Sound to play on sell (Bukkit Sound enum name)
sound-type: "ENTITY_EXPERIENCE_ORB_PICKUP"

# Show a large title pop-up (+$amount) in the centre of the screen on sell?
title-notification-enabled: false

# ---- Economy ----------------------------------------------- #

# VAULT or COINSENGINE
economy-mode: VAULT

# CoinsEngine currency ID (only used if economy-mode: COINSENGINE)
coinsengine-currency-id: coins

# ---- GUI --------------------------------------------------- #

# Filler block used as background in GUIs (must be a valid Material name)
filler-block: "BLACK_STAINED_GLASS_PANE"

# ---- Sell worth tooltip -------------------------------------- #
# Adds a client-side worth line to sellable items using packets.
# Supports the {worth} placeholder.
worth:
  enabled: true
  format: "<gray>Worth <green><bold>${worth}"
  # Show the worth line to players in CREATIVE mode?
  # Leave this false. Creative clients echo item lore back to the server, which
  # bakes the worth line into the real item and causes duplicate lines. Only
  # enable if you fully understand that trade-off.
  show-in-creative: false
  # Worth line used when part of the stack would go into an open FoOrders order
  # rather than the shop. It is a separate line so the figure can be marked as
  # an estimate: somebody else may fill that order before the player sells.
  # /sellworth (the price browser) is never affected by orders.
  order-format: "<gray>Worth <green><bold>~${worth}"

# ---- FoOrders orders ----------------------------------------------- #
# When FoOrders is installed, selling hands items to the players who have open
# orders for them before falling back to the shop, and pays the seller the
# order's own price for that part.
#
# Note: FoOrders pays order money through Vault, which is the only economy it
# supports. If economy-mode above is COINSENGINE, order payouts still arrive as
# Vault money while shop payouts arrive as CoinsEngine - the same split a player
# already gets from delivering through the /order menu by hand.
orders:
  enabled: true
  # Only fill an order when it pays at least the shop price per item, so going
  # through an order never earns the seller less than selling normally would.
  # Set false to always fill orders first, even cheaper ones.
  only-when-better: true
  # Allow a player's own orders to be filled by their own selling. Off by
  # default, matching FoOrders, where you cannot deliver to your own order.
  include-own-orders: false
  # Count order payouts toward category multiplier progress, like shop sales.
  count-toward-multipliers: true
  # Put in front of any money figure that includes order payouts, marking it as
  # an estimate. Leave blank for no marker.
  estimate-marker: "~"

# ---- Menu text ---------------------------------------------- #
# Every title, button name and lore line lives under "messages" near the
# bottom of this file. /sell shows the 9x6 menu players drop items into;
# /sellall opens the sell-everything confirmation directly.

# ---- Item prices dialog (/sellworth) ------------------------- #
# On Minecraft 1.21.6 and newer, /sellworth opens one of the game's own dialog
# screens listing every priced item at once with a search box, instead of the
# paginated chest menu. Older servers always get the menu.
worth-dialog:
  enabled: true
  # How many entries one dialog may carry. The whole screen is sent in a single
  # packet, so the full price list cannot go out at once; players reach the rest
  # through the search box. Raise carefully.
  max-entries: 256
  # How many entries sit side by side.
  columns: 2
  # How wide each entry is, in pixels.
  entry-width: 200
  # Text on the dialog itself. Placeholders on the entries: {item}, {base},
  # {multiplier}, {price}, {category}
  title: "<dark_gray><bold>Item Prices"
  search-label: "Search"
  search-button: "<yellow>Search"
  search-tooltip: "Search the price list."
  entry: "<white>{item} <dark_gray>- <green>${price}"
  entry-tooltip: "Base ${base} x {multiplier} = ${price}"
  showing: "<gray>Showing all {total} items."
  truncated: "<gray>Showing {shown} of {total} items. Search to narrow them down."
  no-matches: "<gray>No items match that search."

# ---- Category order (shown in /sellmulti and /sellworth) ---- #
# These must match the top-level keys in price.yml.
# Up to 9 entries shown in the multiplier GUI.
category-order:
  - armortools
  - blocks
  - crops
  - enchantedbooks
  - fish
  - mobdrops
  - naturalitems
  - ores
  - potions

# ---- Category display settings ------------------------------ #
# Customise the icon and name shown for each category button.
# 'material' must be a valid Minecraft item name.

categories:
  armortools:
    display-name: "<gold>Armor & Tools"
    material: "DIAMOND_SWORD"
    lore:
      - "<gray>Sell your armor, weapons,"
      - "<gray>and tools."
  blocks:
    display-name: "<gray>Blocks"
    material: "STONE"
    lore:
      - "<gray>Sell building blocks."
  crops:
    display-name: "<green>Farming"
    material: "WHEAT"
    lore:
      - "<gray>Sell crops and farm produce."
  enchantedbooks:
    display-name: "<dark_purple>Enchanted Books"
    material: "ENCHANTED_BOOK"
    lore:
      - "<gray>Sell enchanted books."
  fish:
    display-name: "<aqua>Fishing"
    material: "COD"
    lore:
      - "<gray>Sell fish and fishing loot."
  mobdrops:
    display-name: "<red>Mob Drops"
    material: "BONE"
    lore:
      - "<gray>Sell mob loot and drops."
  naturalitems:
    display-name: "<dark_green>Nature"
    material: "OAK_LOG"
    lore:
      - "<gray>Sell logs, leaves, and"
      - "<gray>other natural items."
  ores:
    display-name: "<yellow>Ores & Gems"
    material: "IRON_ORE"
    lore:
      - "<gray>Sell ores and precious gems."
  potions:
    display-name: "<light_purple>Potions"
    material: "POTION"
    lore:
      - "<gray>Sell potions and brewed items."

# ---- GUI Icons --------------------------------------------- #
# Customise every navigation / action icon used across all GUIs.
# 'material' must be a valid Minecraft item name.
# 'name' and each 'lore' line support & colour codes.

icons:
  # ── Shared navigation ──────────────────────────────────────────
  back:
    material: "ARROW"
    name: "<red><bold>Back"
    lore:
      - "<gray>Return to the previous menu."

  prev-page:
    material: "ARROW"
    name: "<yellow>← Previous"
    lore:
      - "<gray>Go to the previous page."

  next-page:
    material: "ARROW"
    name: "<yellow>Next →"
    lore:
      - "<gray>Go to the next page."

  page-indicator:
    material: "PAPER"
    # Name is generated dynamically as "Page X / Y".
    # Only material is used from this entry.

  # ── Confirm / Cancel ───────────────────────────────────────────
  confirm:
    material: "LIME_STAINED_GLASS_PANE"
    name: "<green><bold>Confirm"

  cancel:
    material: "RED_STAINED_GLASS_PANE"
    name: "<red><bold>Cancel"
    lore:
      - "<gray>Go back without selling."

  # ── Sell button (in /sell GUI, bottom-right) ──────────────────
  sell-button:
    material: "LIME_STAINED_GLASS_PANE"
    name: "<green><bold>Sell"

  # ── Category Items GUI ─────────────────────────────────────────
  sell-category:
    material: "GOLD_INGOT"
    name: "<green><bold>Sell Category"

  # ── Confirm Sell-All info icon ─────────────────────────────────
  sell-all-info:
    material: "CHEST"
    name: "<white><bold>Sell All"

  # ── TopSell leaderboard ─────────────────────────────────────────
  topsell-close:
    material: "BARRIER"
    name: "<red><bold>Close"
    lore:
      - "<gray>Close the leaderboard."

# ---- Messages ---------------------------------------------- #
# Every piece of text shown to players can be customised here.
# & colour codes are supported. Placeholders are listed per entry.
messages:
  prefix: "<dark_gray>[<green>SellPlugin<dark_gray>] "
  no-permission: "<red>You do not have permission for this."
  sold-items: "<green>You sold <yellow>{amount} <green>items for <yellow>${price}<green>!"
  nothing-to-sell: "<red>You have no sellable items in your inventory."
  economy-error: "<red>An economy error occurred. Please contact an admin."
  # Shown when a player uses a command for a feature that's toggled off.
  feature-disabled: "<red>This feature is currently disabled."

  # ── Commands / console messages ───────────────────────────────
  player-only-command: "<red>Only players can use this command."
  reload-no-permission: "<red>You do not have permission to reload the config."
  reload-success: "<green>SellPlugin configuration reloaded."

  # ── /showworth (per-player worth tooltip toggle) ──────────────
  showworth-usage: "<red>Usage: /showworth [true|false]"
  showworth-enabled: "<green>Item worth is now <bold>shown<reset><green> in your inventory."
  showworth-disabled: "<yellow>Item worth is now <bold>hidden<reset><yellow> in your inventory."

  # ── Shared decorative separator used in lots of lore lists ────
  lore-separator: "<dark_gray>━━━━━━━━━━━━━━━━━━━"

  # ── Sell notification (title pop-up, {count} = items sold) ────
  action-bar: "<green>+${amount}"
  sell-title: "<green>+${amount}"
  sell-subtitle: "<gray>You sold {count} item(s)"

  # ── Main Shop GUI (/sell) ──────────────────────────────────────
  shop:
    title: "<dark_gray><bold>Put items here to sell"
    sell-button-name: "<green><bold>Sell"
    # The Sell button's lore, line for line. Add, remove or reorder freely.
    # Placeholders: {value} total value, {items} item count,
    #               {marker} "~" while an open order makes up part of the value
    sell-button-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Value: <green>{marker}${value}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<yellow> ✦ Click to sell all items!"
    # Shown instead when nothing in the menu is worth anything.
    sell-button-lore-empty:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ No sellable items"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<yellow> ✦ Click to sell all items!"

  # ── Sell Multi GUI (/sellmulti) ────────────────────────────────
  sellmulti:
    title: "<dark_gray><bold>Multipliers"
    # Placeholders: {category}, {earned}, {effective}
    category-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Earned: <aqua>{earned}x"
      - "<gray> ▸ Effective: <green>{effective}x"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<yellow> ✦ Click to view progress"

  # ── Category Items GUI (list of items in a category) ──────────
  category-items:
    # Placeholder: {category}
    title: "{category}<dark_gray> – Items"
    total-items: "<gray>Total items: {count}"
    page-indicator: "<white>Page {page} / {total}"
    # One item in the list. Placeholders: {item}, {base}, {multiplier}, {price}
    item-name: "<white>{item}"
    item-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ <white>Base:  <green>${base}"
      - "<gray> ▸ <white>Mult:  <aqua>{multiplier}x"
      - "<gray> ▸ <white>Price: <green>${price}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    # The Sell Category button. Placeholders: {category}, {items}, {value}, {marker}
    sell-lore:
      - "<gray> ▸ Category: {category}"
      - "<gray> ▸ Items: <white>{items}"
      - "<gray> ▸ Earn: <green>{marker}${value}"
    sell-lore-empty:
      - "<gray> ▸ Category: {category}"
      - "<red> ▸ No items to sell."

  # ── Category Progress GUI (multiplier snake path) ─────────────
  category-progress:
    # Placeholder: {category}
    title: "{category}"
    # Each milestone node. Placeholders: {milestone}, {status}, {status_color},
    # {earned}, {required}, {percent}, {remaining}, {category}
    node-name: "{status_color}<bold>{milestone}x Multiplier"
    status-completed: "Completed"
    status-in-progress: "In progress"
    status-locked: "Locked"
    status-color-completed: "<green>"
    status-color-in-progress: "<yellow>"
    status-color-locked: "<dark_gray>"
    node-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Status: {status_color}{status}"
    # Added to the first node only, which opens the item list.
    node-lore-start:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<yellow> ✦ Click to view items & prices"
    # Added to the milestone currently being worked toward.
    node-lore-progress:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Earned: <green>${earned}"
      - "<gray> ▸ Required: <green>${required}"
      - "<gray> ▸ Progress: <yellow>{percent}%"
    # Added to milestones still locked.
    node-lore-locked:
      - "<gray> ▸ Need: <green>${remaining}<gray> more to unlock"

  # ── Confirm Sell (category) GUI ────────────────────────────────
  # Placeholders throughout: {category}, {items}, {value}, {marker}
  confirm-sell:
    title: "<dark_gray><bold>Sell your {category}"
    info-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Items: <white>{items}"
      - "<gray> ▸ Value: <green>{marker}${value}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
    # Lines mentioning {value} are dropped when there is nothing to sell.
    confirm-lore:
      - "<gray> ▸ Sell all {category}<gray> items"
      - "<gray> ▸ from your inventory."
      - "<green> ▸ You will earn: {marker}${value}"
    cancel-lore:
      - "<gray> ▸ Go back without selling."

  # ── Confirm Sell-All GUI (opened directly by /sellall) ─────────
  # Placeholders throughout: {items}, {value}, {marker}
  confirm-sell-all:
    title: "<dark_gray><bold>Confirm sell all"
    info-name: "<white><bold>Sell all"
    info-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Items: <white>{items}"
      - "<gray> ▸ Value: <green>{marker}${value}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
    # Lines mentioning {value} are dropped when there is nothing to sell.
    confirm-lore:
      - "<gray> ▸ Sell all items from your inventory."
      - "<green> ▸ You will earn: {marker}${value}"
    cancel-lore:
      - "<gray> ▸ Go back without selling."

  # ── Top Sellers Leaderboard GUI ────────────────────────────────
  top-sell:
    title: "<dark_gray><bold>Top sellers"
    close-lore: "<gray>Close the leaderboard."
    prev-page-lore: "<gray>Previous page."
    next-page-lore: "<gray>Next page."
    total-players: "<gray>Total players: <white>{count}"
    page-indicator: "<white>Page {page} / {total}"
    # One leaderboard entry. Placeholders: {rank}, {rank_color}, {player}, {earned}
    entry-name: "{rank_color}#{rank} <white>{player}"
    entry-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ Total earned: <green>${earned}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━"
    rank-color-first: "<gold>"
    rank-color-second: "<gray>"
    rank-color-third: "<dark_red>"
    rank-color-other: "<white>"

  # ── Worth GUI (/sellworth, /worth) ─────────────────────────────
  worth-gui:
    title: "<dark_gray><bold>Item Prices <gray>(Page {page})"
    filter-all: "<yellow><bold>FILTER: <white>All"
    # Placeholder: {category}
    filter-category: "<yellow><bold>FILTER: {category}"
    filter-hint: "<gray>Click to cycle filter."
    filter-option-all: "All"
    filter-option: "<gray> • {category}"
    filter-option-selected: "<green> • {category}"
    close-lore: "<gray>Close the menu."
    prev-page-lore: "<gray>Previous page."
    next-page-lore: "<gray>Next page."
    total-items: "<gray>Total items: <white>{count}"
    page-indicator: "<white>Page {page} / {total}"
    # One priced item. Placeholders: {item}, {base}, {multiplier}, {price}, {category}
    item-name: "<white>{item}"
    item-lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
      - "<gray> ▸ <white>Base:  <green>${base}"
      - "<gray> ▸ <white>Mult:  <aqua>{multiplier}x"
      - "<gray> ▸ <white>Price: <green>${price}"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
      - "<gray> Category: {category}"
